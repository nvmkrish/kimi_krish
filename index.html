<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kimi K2.5 on Puter (User-Pays)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Puter JS -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 0 0 16px 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button.secondary {
      background: #334155;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 12px;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
      color: #e5e7eb;
      outline: none;
    }

    .output {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      min-height: 120px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🚀 Kimi K2.5 on Puter (User-Pays)</h1>

    <div class="status" id="status">Not logged in</div>

    <div class="row">
      <button id="loginBtn">Login with Puter</button>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>

    <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>

    <div class="row" style="margin-top: 12px;">
      <button id="sendBtn">Send to Kimi K2.5</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <div class="output" id="outputBox">Response will appear here...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const promptInput = document.getElementById("promptInput");
    const outputBox = document.getElementById("outputBox");

    async function updateAuthStatus() {
      try {
        const user = await puter.auth.getUser();
        if (user) {
          statusEl.textContent = "Logged in as: " + (user.username || "User");
        } else {
          statusEl.textContent = "Not logged in";
        }
      } catch {
        statusEl.textContent = "Not logged in";
      }
    }

    loginBtn.onclick = async () => {
      await puter.auth.signIn();
      updateAuthStatus();
    };

    logoutBtn.onclick = async () => {
      await puter.auth.signOut();
      updateAuthStatus();
    };

    clearBtn.onclick = () => {
      promptInput.value = "";
      outputBox.textContent = "Response will appear here...";
    };

    sendBtn.onclick = async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert("Enter a prompt first!");
        return;
      }

      const user = await puter.auth.getUser();
      if (!user) {
        alert("Please login with Puter first.");
        return;
      }

      outputBox.textContent = "Thinking...";
      sendBtn.disabled = true;

      try {
        const response = await puter.ai.chat(prompt, {
          model: "moonshotai/kimi-k2.5"
        });

        let text = "";

        if (response?.message?.content) {
          text = response.message.content;
        } else if (typeof response === "string") {
          text = response;
        } else {
          text = "No text response found.";
        }

        outputBox.textContent = text;
      } catch (err) {
        outputBox.textContent = "Error: " + (err?.message || JSON.stringify(err));
      } finally {
        sendBtn.disabled = false;
      }
    };

    updateAuthStatus();
  </script>
</body>
</html>
